<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 1200px;
            height: 630px;
            background: linear-gradient(135deg, #111111 0%, #1a1a1a 100%);
            font-family: 'Arial', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        .bg-effects {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }
        
        .circle1 {
            position: absolute;
            top: -100px;
            right: -100px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.3) 0%, transparent 70%);
            border-radius: 50%;
        }
        
        .circle2 {
            position: absolute;
            bottom: -100px;
            left: -100px;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.3) 0%, transparent 70%);
            border-radius: 50%;
        }
        
        .content {
            text-align: center;
            z-index: 10;
            color: white;
            max-width: 800px;
            padding: 40px;
        }
        
        .logo {
            font-size: 120px;
            font-weight: bold;
            background: linear-gradient(45deg, #8b5cf6, #3b82f6, #ec4899);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            text-shadow: 0 0 30px rgba(139, 92, 246, 0.5);
        }
        
        .subtitle {
            font-size: 32px;
            color: #e5e7eb;
            margin-bottom: 15px;
            font-weight: 600;
        }
        
        .description {
            font-size: 24px;
            color: #9ca3af;
            margin-bottom: 30px;
            line-height: 1.4;
        }
        
        .cta {
            background: linear-gradient(45deg, #8b5cf6, #3b82f6);
            color: white;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 20px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: none;
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.3);
        }
    </style>
</head>
<body>
    <div class="bg-effects">
        <div class="circle1"></div>
        <div class="circle2"></div>
    </div>
    
    <div class="content">
        <div class="logo">OWEN</div>
        <div class="subtitle">Banda Musical Latina Pop</div>
        <div class="description">Dominico-Venezolana • Música Romántica y Bohemia</div>
        <div class="cta">Escucha Nuestra Música</div>
    </div>
</body>
</html>
